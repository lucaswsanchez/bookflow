# Render Blueprint — creates the BookFlow API web service.
# Secrets marked "sync: false" are entered in the Render dashboard, never committed.
services:
  - type: web
    name: bookflow-api
    runtime: node
    plan: free
    region: oregon
    rootDir: .
    buildCommand: >-
      corepack enable &&
      pnpm install --frozen-lockfile &&
      pnpm --filter api build &&
      pnpm --filter api exec prisma migrate deploy &&
      pnpm --filter api db:seed
    startCommand: pnpm --filter api start:prod
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: LOGIN_RATE_LIMIT
        value: '10'
