services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: bookflow
      POSTGRES_PASSWORD: bookflow
      POSTGRES_DB: bookflow
    ports: ['5432:5432']
    volumes: [db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bookflow']
      interval: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://bookflow:bookflow@db:5432/bookflow
      DIRECT_URL: postgresql://bookflow:bookflow@db:5432/bookflow
      JWT_ACCESS_SECRET: change-me-in-production
      CORS_ORIGINS: http://localhost:5173
      PORT: 3000
    ports: ['3000:3000']
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: http://localhost:3000
    ports: ['5173:80']
    depends_on: [api]

volumes:
  db-data:
